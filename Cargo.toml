[package]
name = "onset"
version = "0.1.0"
edition = "2024"
description = "Stimulus presentation for fMRI experiments on macOS: frame-accurate, scanner-synced, TOML-defined"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mihirneal/onset"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3"
glyphon = "0.12.0"
objc2 = "0.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
toml = "1.1.6"
wgpu = "30.0.1"
winit = "0.30.13"

[profile.release]
debug = 1
