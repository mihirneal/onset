[package]
name = "onset"
version = "0.1.0"
edition = "2024"
description = "Stimulus presentation for fMRI experiments on macOS: frame-accurate, scanner-synced, TOML-defined"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mihirneal/onset"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3"
glyphon = "0.12.0"
objc2 = "0.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
toml = "1.1.6"
wgpu = "30.0.1"
winit = "0.30.13"
hidapi = "2.6.7"

# Our own present step (src/present.rs), for Metal's report of when each
# frame reached the screen. These MUST be the versions wgpu 30's Metal
# backend (wgpu-hal 30.0.1) uses: objc2 0.6, block2 0.6, objc2-metal and
# objc2-quartz-core 0.3. Otherwise the CAMetalLayer and MTLCommandQueue that
# wgpu hands us are different types from the ones we name.
block2 = "0.6.2"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",                # addPresentedHandler
    "objc2-core-foundation", # presentedTime (wgpu doesn't turn this one on)
    "MTLAllocation",
    "MTLCommandBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLResource",
    "MTLTexture",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation", # CACurrentMediaTime
    "objc2-metal",           # nextDrawable, CAMetalDrawable
    "CABase",
    "CALayer",
    "CAMetalLayer",
] }

[profile.release]
debug = 1
