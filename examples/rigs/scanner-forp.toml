# Example rig: an MR display at 120 Hz, connected to the stimulus Mac as a
# separate (extended, not mirrored) display, and a Current Designs fORP 932
# in USB keyboard mode ("HID KEY BYGRT" on its display). In that mode the
# fORP types "t" for every volume and b/y/g/r for the buttons. Copy this file
# and adjust it for your site.
#
# If the fORP is switched to "HID KEY 12345" instead, the trigger is "5" and
# the buttons are 1-4: change [trigger] key and the [buttons] keys to match.

[display]
# Default: the first display that isn't the laptop's own screen. macOS gives
# winit no real display names ("Monitor #28928"), so pick by index if needed:
# `onset displays` lists them.
# monitor = 1
fullscreen = true
expected_hz = 120
hide_cursor = true

[trigger]
# Read the fORP directly over USB: triggers and buttons arrive whichever
# window has focus, timestamped on arrival. Needs macOS's Input Monitoring
# permission for the terminal app, once. `onset inputs --rig <this file>`
# shows every pulse and press as it arrives.
source = "hid"
device = "181b:0008"   # Current Designs fORP 932 (`onset ports` lists USB devices)
key = "t"
# Or through the focused window instead (no permission needed, but the
# stimulus window must keep keyboard focus):
# source = "keyboard"

[buttons]
# raw key = label used in experiments. With two 2-button pads, each pad
# sends its own keys (here y/b and r/g); a pad held in the other hand
# mirrors, so label the pads left/right. Here the right hand gives 1 and 2,
# so two-button tasks work one-handed, and the left hand gets 3 and 4 so the
# two hands never mix. For a left/right-hand task, use "1" and "3".
"y" = "1"
"b" = "2"
"r" = "3"
"g" = "4"

[photodiode]
enabled = true
corner = "bottom-left"
size = 40
flash_frames = 3

[site]
logo = "bcm-logo-white.png"  # on the welcome screen; point it at your own

[output]
dir = "data"
