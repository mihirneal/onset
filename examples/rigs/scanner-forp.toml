# The scanner rig at BCM's CAMRI (Siemens Prisma), confirmed on 2026-10-20:
# BOLDscreen32 at 1920x1080, 120 Hz, connected to the stimulus Mac as a
# separate (extended, not mirrored) display through the Gefen KVM, and a
# Current Designs fORP 932 in USB keyboard mode ("HID KEY BYGRT" on its
# display). In that mode the fORP types "t" for every volume and b/y/g/r
# for the buttons. Dummy volumes and the localizer send no trigger.
#
# If the fORP is switched to "HID KEY 12345" instead, the trigger is "5" and
# the buttons are 1-4: change [trigger] key and the [buttons] keys to match.

[display]
# Default: the first display that isn't the laptop's own screen. macOS gives
# winit no real display names ("Monitor #28928"), so pick by index if needed:
# `onset displays` lists them.
# monitor = 1
fullscreen = true
expected_hz = 120
hide_cursor = true

[trigger]
source = "keyboard"
key = "t"

[buttons]
# raw key = label used in experiments. Two pads, two buttons each, checked by
# pressing them on 2026-10-20: right index "y", right middle "b",
# left index "r", left middle "g". The right hand gives 1 and 2, so two-button
# tasks work one-handed; the left hand gets its own labels so presses from the
# two hands never mix. For a left/right-hand task, use "1" and "3".
"y" = "1"
"b" = "2"
"r" = "3"
"g" = "4"

[photodiode]
enabled = true
corner = "bottom-left"
size = 40
flash_frames = 3

[output]
dir = "data"
