# Event-related Eriksen flanker task with jittered ITIs.
#
# Onsets come from schedule.tsv (e.g. generated by optseq2 or AFNI's
# make_random_timing.py). Press 1 if the middle arrow points left, 2 if right.
#
#   onset run examples/flanker/experiment.toml --simulate --windowed

[experiment]
name = "Flanker"
task = "flanker"
background = "black"
color = "white"
font_size = 72
baseline = "fixation"
instructions = "Look at the MIDDLE arrow.\n\nIndex finger (1) if it points ←\nMiddle finger (2) if it points →\n\nRespond as fast and accurately as you can."
waiting_text = "Get ready…"

[scanner]
tr = 2.0
dummy_volumes = 0
volumes = 30

[stimuli.fixation]
type = "fixation"
size = 36
thickness = 4

[stimuli.arrows]
type = "text"
text = "{arrows}"
size = 96

[stimuli.fb_correct]
type = "text"
text = "✓"
color = "green"

[stimuli.fb_incorrect]
type = "text"
text = "✗"
color = "red"

[stimuli.fb_miss]
type = "text"
text = "Too slow"
color = "yellow"
size = 48

[trial]
trial_type = "{condition}"

[[trial.events]]
name = "target"
stimulus = "arrows"
duration = 0.8
# Listen for 1.5 s from target onset (keeps listening into the blank).
response = { buttons = ["1", "2"], correct = "{answer}", window = 1.5 }

[[trial.events]]
name = "blank"
stimulus = "blank"
duration = 0.7
log = false

[[trial.events]]
name = "feedback"
stimulus = "fb_{outcome}"
duration = 0.5

[schedule]
file = "schedule.tsv"
onset_column = "onset"
